name: Tests

on:
  pull_request:

env:
  APP_NAME: bookshelfs

jobs:
  code-lint:
    name: Run PHP Linter and Code Style checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the project
        uses: actions/checkout@v6
      - name: Setup node and NPM
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install npm
        shell: bash
        run: npm install -g npm@^11

      - name: Get the date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
      - name: Cache NPM cache
        uses: actions/cache@v5.0.1
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ steps.date.outputs.date }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.date.outputs.date }}-
            ${{ runner.os }}-node-
      - name: Cache composer files
        uses: actions/cache@v5.0.1
        with:
          path: |
            vendor
          key: ${{ runner.os }}-composer-${{ steps.date.outputs.date }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ steps.date.outputs.date }}-
            ${{ runner.os }}-composer-

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Get PHP version
        shell: bash
        run: php -v

      - name: Install PHP packages
        shell: bash
        run: composer install

      - name: Install Node packages
        shell: bash
        run: npm -q ci || { cat ~/.npm/eresolve-report.txt ; exit 1; }

      - name: Run PHP linter
        shell: bash
        run: composer lint
      - name: Run PHP code style checker
        shell: bash
        run: composer cs:check
      - name: Run PHP type checker Psalm
        shell: bash
        run: composer psalm

#      - name: Check for issues with vue and js files (eslint)
#        shell: bash
#        run: >-
#          npm run lint || {
#          echo '::error ::The eslint style checker failed.
#          Please run `npm run eslint-fix` in order to correct this.';
#          exit 1;
#          }

      - name: Check for formatting issues with CSS files (stylelint)
        shell: bash
        run: >-
          npm run stylelint || {
          echo '::error ::The stylelint checker failed.
          Please run `npm run stylelint-fix` to help solving these issues if possible.';
          exit 1;
          }

  php:
    runs-on: ubuntu-latest

    strategy:
      # do not stop on another job's failure
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3']
        databases: ['sqlite', 'mysql', 'pgsql']
        server-versions: ['stable30', 'stable31', 'stable32', 'stable33', 'master']

    name: php${{ matrix.php-versions }}-${{ matrix.databases }}-${{ matrix.server-versions }}

    services:
      postgres:
        image: postgres:16
        ports:
          - 4445:5432/tcp
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nextcloud
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5
      mysql:
        image: mariadb:10.11
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 2s --health-retries 5

    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}
          submodules: true

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit
          extensions: mbstring, iconv, fileinfo, intl, sqlite, pdo_sqlite, gd, zip

      - name: Set up PHPUnit
        working-directory: apps/${{ env.APP_NAME }}
        run: composer i

      - name: Set up Nextcloud
        run: |
          if [ "${{ matrix.databases }}" = "mysql" ]; then
            export DB_PORT=4444
          elif [ "${{ matrix.databases }}" = "pgsql" ]; then
            export DB_PORT=4445
          fi
          mkdir data
          ./occ maintenance:install --verbose --database=${{ matrix.databases }} --database-name=nextcloud --database-host=127.0.0.1 --database-port=$DB_PORT --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: PHPUnit
        working-directory: apps/${{ env.APP_NAME }}
        run: ./vendor/phpunit/phpunit/phpunit -c tests/phpunit.xml
